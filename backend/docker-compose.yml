version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: coffee_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: brew_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. FastAPI Web Backend Service
  web:
    build: ./backend
    container_name: coffee_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Connects to the 'db' container service defined above
      DATABASE_URL: postgresql://postgres:password@db:5432/brew_db
    depends_on:
      - db

volumes:
  postgres_data: