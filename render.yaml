services:
  # FastAPI Web Service
  - type: web
    name: coffee-brew-backend
    runtime: python
    region: oregon # Options: oregon, frankfurt, singapore, ohio
    plan: free # Free tier plan
    rootDir: backend 
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coffee-brew-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  # Managed PostgreSQL Database
  - name: coffee-brew-db
    databaseName: brew_db
    user: postgres
    plan: free