version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: coffee_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: brew_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. FastAPI Backend
  web:
    build: ./backend
    container_name: coffee_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/brew_db
    depends_on:
      - db

  # 3. Flutter Web Frontend
  frontend:
    build: ./frontend
    container_name: coffee_flutter_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - web

volumes:
  postgres_data: